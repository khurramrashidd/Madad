<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0B8A5B" />
    <meta name="description" content="Post a small local task with a cash bounty. A neighbour does it. You pay them directly on UPI." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Madad" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Madad — Local Micro-Bounties</title>

    <!--
      Theme applied before first paint.

      React cannot do this: by the time the bundle has parsed and mounted, the
      browser has already painted a white page, and a dark-mode user sees a
      bright flash on every cold start. This blocking inline script sets the
      attribute the CSS variables key off, so the very first paint is correct.
      It duplicates a few lines of ThemeContext on purpose — that is the price
      of running before anything else.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('madad_theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (dark) {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0E1316');
          }
        } catch (e) {
          /* storage blocked — light theme is a fine default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
